<svg xmlns="http://www.w3.org/2000/svg" width="2290" height="687" viewBox="0 0 2290 687" role="img" aria-labelledby="title desc">
  <title id="title">Mac mini Personal Cloud</title>
  <desc id="desc">Docker, File Browser, Tailscale, NAStool and external SSD personal cloud banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1426"/>
      <stop offset="55%" stop-color="#101b31"/>
      <stop offset="100%" stop-color="#14253a"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#dce5ef"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe7f0"/>
      <stop offset="100%" stop-color="#c4d0de"/>
    </linearGradient>
    <linearGradient id="macBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19b8ff"/>
      <stop offset="100%" stop-color="#05a5df"/>
    </linearGradient>
    <linearGradient id="dockerBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d72ff"/>
      <stop offset="100%" stop-color="#2457e6"/>
    </linearGradient>
    <linearGradient id="iphoneBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19c866"/>
      <stop offset="100%" stop-color="#0faa4f"/>
    </linearGradient>
  </defs>

  <rect width="2290" height="687" rx="38" fill="url(#bg)"/>
  <circle cx="1715" cy="110" r="270" fill="#204466" opacity="0.40"/>
  <circle cx="2045" cy="310" r="275" fill="#0e555a" opacity="0.28"/>
  <circle cx="2135" cy="520" r="330" fill="#153f46" opacity="0.23"/>

  <g transform="translate(85 215)">
    <rect x="0" y="0" width="300" height="190" rx="34" fill="url(#device)"/>
    <rect x="22" y="20" width="256" height="125" rx="25" fill="url(#screen)"/>
    <circle cx="250" cy="164" r="10" fill="#16c96a"/>
  </g>

  <g fill="#f5f7fa" transform="translate(415 200)">
    <circle cx="120" cy="120" r="92"/>
    <circle cx="235" cy="130" r="88"/>
    <circle cx="320" cy="185" r="76"/>
    <rect x="75" y="125" width="310" height="150" rx="76"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="820" y="230" fill="#f8fafc" font-size="66" font-weight="800">Mac mini Personal Cloud</text>
    <text x="820" y="315" fill="#e3e8ef" font-size="34" font-weight="500">Docker + File Browser + Tailscale + NAStool + external SSD</text>
    <text x="820" y="390" fill="#9fb0c6" font-size="30" font-weight="500">iPhone remote access • HEIC preview fixes • APFS storage • real-world troubleshooting</text>

    <g transform="translate(820 440)">
      <rect x="0" y="0" width="190" height="68" rx="34" fill="url(#macBadge)"/>
      <text x="95" y="45" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="700">macOS</text>

      <rect x="220" y="0" width="210" height="68" rx="34" fill="url(#dockerBadge)"/>
      <text x="325" y="45" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="700">Docker</text>

      <rect x="465" y="0" width="205" height="68" rx="34" fill="url(#iphoneBadge)"/>
      <text x="568" y="45" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="700">iPhone</text>
    </g>
  </g>
</svg>
